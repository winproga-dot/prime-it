name: PRIME IT baseline audit
on:
  push:
    branches: [prime-it-redesign-2026]
    paths:
      - 'scripts/baseline-audit.mjs'
      - '.github/workflows/baseline.yml'
permissions:
  contents: write
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright sharp
      - run: npx playwright install --with-deps chromium
      - name: Read public site and inspect existing 2GIS link
        run: node scripts/baseline-audit.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baseline-audit
          path: .audit/
