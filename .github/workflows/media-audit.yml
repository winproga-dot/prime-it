name: PRIME IT media source and deployed video audit
on:
  push:
    branches: [prime-it-media-audit]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Install video inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Inspect public photo sources and deployed video
        run: node scripts/audit-media.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
